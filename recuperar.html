<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="css/login.css">

    <!-- favicons
    ================================================== -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

</head>

<body>

<div class="login-wrapper">

    <div class="login-card animate-fade">

        <img src="images/logo.png" class="logo">

        <h2>Recuperar Senha</h2>

        <p style="font-size:14px; margin-bottom:20px;">
            Digite seu e-mail e enviaremos instruções.
        </p>

        <form>
            <label>E-mail</label>
            <input type="email" placeholder="exemplo@gmail.com" required>

            <button class="btn-login">Enviar</button>
        </form>

        <a href="login.html" class="recuperar">Voltar ao login</a>

    </div>

</div>

</body>
</html>
